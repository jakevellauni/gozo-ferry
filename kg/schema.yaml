# The schema of the ferry's knowledge layer (Session 7, Stage 16): Gozo ferry knowledge v1.0, cancellations of 2025.
# Written after the competency questions (kg/questions.yaml) and before the instance files, which must conform to
# it; tests/test_knowledge.py checks every file against it. Fictitious, written for the Practice Exercise.
# Owner: the operator's operations manager, who reviews every change.
#
# min and max are cardinalities: how many of the relationship each instance of the first class must have.
# max: null means no upper limit.
version: "1.0"
owner: the operations manager

classes:
  Port:         {key: id, file: kg/ports.yaml, description: a port a crossing departs from}
  Vessel:       {key: id, file: kg/vessels.yaml, description: a ship of the fleet}
  Reason:       {key: id, file: kg/reasons.yaml, description: why a crossing was cancelled, a kind of its broader reason}
  Label:        {key: text, file: "kg/ports.yaml, kg/reasons.yaml", description: a way staff write a port or a reason}
  Cancellation: {key: [date, time, port], file: data/gozo_operations_2025.csv,
                 description: one crossing that did not sail, from one port, on one day, at one time}

properties:
  - {class: Port, name: name, type: string, required: true}
  - {class: Vessel, name: name, type: string, required: true}
  - {class: Reason, name: name, type: string, required: true}
  - {class: Cancellation, name: date, type: date, required: true}
  - {class: Cancellation, name: time, type: time, required: true}

relationships:
  - {name: BROADER, from: Reason, to: [Reason], min: 0, max: 1}
  - {name: MEANS, from: Label, to: [Port, Reason], min: 1, max: 1}
  - {name: DEPARTS_FROM, from: Cancellation, to: [Port], min: 1, max: 1}
  - {name: ON_VESSEL, from: Cancellation, to: [Vessel], min: 1, max: 1}
  - {name: FOR_REASON, from: Cancellation, to: [Reason], min: 1, max: 1}
